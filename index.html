<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Cáo Tiến Độ Work</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #statusMessage { font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Gửi Báo Cáo Vào Google Sheet</h2>

  <form id="reportForm">
    <div class="form-group">
      <label for="sheetSelect">Chọn danh mục báo cáo:</label>
      <select id="sheetSelect" onchange="updateFormFields()">
        <option value="绩效目标达进展">1. Tiến độ mục tiêu KPI (绩效目标达进展)</option>
        <option value="客户跟进情况">2. Chăm sóc khách hàng (客户跟进情况)</option>
        <option value="下月重点工作">3. Công việc trọng tâm tháng tới (下月重点工作)</option>
        <option value="卡点 / 异常问题讨论">4. Thảo luận vấn đề / Điểm nghẽn (卡点 / 异常问题讨论)</option>
      </select>
    </div>

    <!-- Các ô nhập động thay đổi theo Sheet chọn -->
    <div id="dynamicFields"></div>

    <button type="submit" id="submitBtn">Gửi báo cáo</button>
  </form>

  <p id="statusMessage"></p>

  <script>
    // DÁN URL WEB APP CỦA BẠN VÀO ĐÂY
    const GOOGLE_SCRIPT_URL = 'DÁN_WEB_APP_URL_TỪ_APPS_SCRIPT_VÀO_ĐÂY';

    // Tự động thay đổi giao diện nhập liệu theo Sheet chọn
    function updateFormFields() {
      const selectedSheet = document.getElementById('sheetSelect').value;
      const fieldsDiv = document.getElementById('dynamicFields');
      
      if (selectedSheet === '绩效目标达进展') {
        fieldsDiv.innerHTML = `
          <div class="form-group">
            <label>Tên chỉ số (指标名称):</label>
            <input type="text" id="col1" required>
          </div>
          <div class="form-group">
            <label>Chỉ tiêu / Mục tiêu (目标值):</label>
            <input type="text" id="col2" required>
          </div>
          <div class="form-group">
            <label>Thực tế hoàn thành (实际完成值):</label>
            <input type="text" id="col3" required>
          </div>
          <div class="form-group">
            <label>Tiến độ达成进度 (%):</label>
            <input type="text" id="col4">
          </div>
          <div class="form-group">
            <label>Giải trình lệch / Hành động cải tiến (偏差说明 / 改进动作):</label>
            <textarea id="col5" rows="3"></textarea>
          </div>
        `;
      } else {
        fieldsDiv.innerHTML = `
          <div class="form-group">
            <label>Nội dung 1 / Tên công việc / Khách hàng:</label>
            <input type="text" id="col1" required>
          </div>
          <div class="form-group">
            <label>Nội dung 2 / Chi tiết:</label>
            <input type="text" id="col2">
          </div>
          <div class="form-group">
            <label>Nội dung 3 / Tiến độ / Trạng thái:</label>
            <input type="text" id="col3">
          </div>
          <div class="form-group">
            <label>Ghi chú / Đề xuất:</label>
            <textarea id="col4" rows="3"></textarea>
          </div>
        `;
      }
    }

    // Khởi tạo phom ban đầu
    updateFormFields();

    // Xử lý gửi form
    document.getElementById('reportForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      const selectedSheet = document.getElementById('sheetSelect').value;

      submitBtn.disabled = true;
      statusMsg.style.color = 'blue';
      statusMsg.innerText = 'Đang gửi dữ liệu...';

      const dataToSend = {
        sheetName: selectedSheet,
        col1: document.getElementById('col1') ? document.getElementById('col1').value : '',
        col2: document.getElementById('col2') ? document.getElementById('col2').value : '',
        col3: document.getElementById('col3') ? document.getElementById('col3').value : '',
        col4: document.getElementById('col4') ? document.getElementById('col4').value : '',
        col5: document.getElementById('col5') ? document.getElementById('col5').value : ''
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataToSend)
      })
      .then(() => {
        statusMsg.style.color = 'green';
        statusMsg.innerText = 'Lưu thành công vào tab "' + selectedSheet + '"!';
        document.getElementById('reportForm').reset();
        updateFormFields();
        submitBtn.disabled = false;
      })
      .catch(error => {
        console.error('Lỗi:', error);
        statusMsg.style.color = 'red';
        statusMsg.innerText = 'Có lỗi xảy ra, vui lòng thử lại!';
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
