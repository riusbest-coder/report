<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Form Lưu Dữ Liệu Vào 4 Sheet</title>
</head>
<body>

  <h2>Gửi thông tin dữ liệu</h2>

  <form id="multiSheetForm">
    <!-- Lựa chọn 1 trong 4 Sheet -->
    <label for="sheetSelect"><b>Chọn danh mục cần lưu:</b></label><br>
    <select id="sheetSelect" required>
      <option value="Sheet1">Sheet 1: Doanh Thu</option>
      <option value="Sheet2">Sheet 2: Khách Hàng</option>
      <option value="Sheet3">Sheet 3: Kho Hàng</option>
      <option value="Sheet4">Sheet 4: Góp Ý</option>
    </select>
    <br><br>

    <input type="text" id="HoTen" placeholder="Họ và tên" required><br><br>
    <input type="email" id="Email" placeholder="Email" required><br><br>
    <input type="text" id="SoDienThoai" placeholder="Số điện thoại"><br><br>
    <textarea id="NoiDung" placeholder="Nội dung/Chi tiết"></textarea><br><br>

    <button type="submit" id="submitBtn">Gửi dữ liệu</button>
  </form>

  <p id="statusMessage" style="font-weight: bold; color: green;"></p>

  <script>
    // DÁN URL WEB APP LẤY Ở BƯỚC 3 VÀO ĐÂY
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbJJm6Wm8qePQhlhhe4nowhYKpkiy4XC18INyVntsJ9EeSQWGly7eAei9TDl4Amv2wBA/exec';

    document.getElementById('multiSheetForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');

      submitBtn.disabled = true;
      statusMsg.innerText = 'Đang gửi dữ liệu...';

      // Lấy dữ liệu form cùng tên Sheet được chọn
      const dataToSend = {
        sheetName: document.getElementById('sheetSelect').value,
        HoTen: document.getElementById('HoTen').value,
        Email: document.getElementById('Email').value,
        SoDienThoai: document.getElementById('SoDienThoai').value,
        NoiDung: document.getElementById('NoiDung').value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataToSend)
      })
      .then(() => {
        statusMsg.innerText = 'Đã lưu thành công vào tab "' + dataToSend.sheetName + '"!';
        document.getElementById('multiSheetForm').reset();
        submitBtn.disabled = false;
      })
      .catch(error => {
        console.error('Lỗi:', error);
        statusMsg.innerText = 'Có lỗi xảy ra, vui lòng thử lại!';
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
